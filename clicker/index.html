<!DOCTYPE html>
<html lang="en">
<head>
<title>Code Clicker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
    <header>
        <h1>Code Cliker</h1>
        <h2 id="score-display">0 Lines of Code</h2>
        <button id="main-button" onclick="writeCode()">Write Code</button>
        
    </header>

    <main id="shop">
        <h3>Hardware Store (Manaul Upgrade)</h3>
        <p>Current Click Power : <span id="power-display">1</span></p>
        <button id="upgrade-button" onclick="buyKeyboard()">
            Buy New Keyboard (Cost: <span id="cost-display">50</span>)
        </button>
         <button id="double-button" onclick="doubleScore()">
            Double Score (Availible at: 500,000)
        </button>

          <h3>Hiring Department (Auto-Click)</h3>
        <p>Active Interns: <span id="intern-display">0</span></p>
        <button id="intern-button" onclick="buyIntern()">
            Hire Intern (Cost: <span id="cost-intern-display">100</span>)
        </button>
                <p>Active Employees: <span id="employee-display">0</span></p>
        <button id="employee-button" onclick="buyEmployee()">
            Hire Employee (Cost: <span id="cost-employee-display">1000</span>)
        </button>


    </main>
</div>

<script src="script.js"></script>
</body>
</html>
