<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SideTracked</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- This banner stays on every page. -->
    <header>
        <a href="#home" class="logo">SideTracked ✦</a>

        <nav aria-label="Main navigation">
            <a href="#home" data-page="home">Home</a>
            <a href="#playlists" data-page="playlists">All Playlists</a>
            <a href="#artists" data-page="artists">Artists</a>
            <a href="#genres" data-page="genres">Genres</a>
            <a href="#random" data-page="random" class="random-link">
                Random playlist Rec
            </a>
        </nav>
    </header>

    <!-- JavaScript changes the contents of this area. -->
    <main id="content"></main>

    <footer>
        <p>SideTracked — a soundtrack for whatever you're doing.</p>
        <p>Listen through Spotify.</p>
    </footer>

    <noscript>
        Please enable JavaScript to use SideTracked.
    </noscript>

</body>
</html>
